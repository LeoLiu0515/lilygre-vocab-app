<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<title>考前衝刺｜字根單字通勤機</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="考前衝刺">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- HOME -->
  <section id="view-home" class="view active">
    <header class="topbar">
      <div class="brand">🔥 考前衝刺模式</div>
      <div style="width:32px"></div>
    </header>

    <div class="home-hero">
      <div class="hero-label">背誦進度</div>
      <div class="progress-ring-wrap">
        <svg viewBox="0 0 120 120" class="progress-ring">
          <circle cx="60" cy="60" r="52" class="ring-bg"/>
          <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"/>
        </svg>
        <div class="ring-label">
          <div id="ring-pct">0%</div>
          <div class="ring-small" id="ring-count">0 / 0</div>
        </div>
      </div>
      <div class="home-breakdown" id="home-note"></div>
    </div>

    <button id="btn-start-session" class="cta-btn">開始背單字</button>

    <div class="home-foot">
      <button id="btn-reset" class="danger-btn">重置「背起來了」的紀錄</button>
    </div>
  </section>

  <!-- FLASHCARD SESSION -->
  <section id="view-session" class="view">
    <header class="topbar">
      <button id="btn-exit-session" class="icon-btn">✕</button>
      <div class="session-progress-mid">
        <div class="session-progress-bar"><div id="session-progress-fill"></div></div>
        <div class="session-progress-label">
          <span id="session-progress-count">0 / 0</span>
        </div>
      </div>
      <div style="width:32px"></div>
    </header>

    <div class="card-stage">
      <div id="card-swiper">
      <div id="flashcard" class="flashcard">
        <div class="card-face card-front">
          <div class="card-word" id="card-word"></div>
          <div class="card-front-example" id="card-front-example"></div>
          <div class="card-hint">點卡片看解答 · 上滑看下一個</div>
        </div>
        <div class="card-face card-back">
          <div class="card-back-inner">
            <div class="card-word-row">
              <span class="card-word-small" id="card-word-back"></span>
              <button id="btn-speak" class="speak-mini" title="發音" aria-label="發音">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.2v13.6L7.2 14.5H4z"/><path d="M15.6 8.8a4.4 4.4 0 0 1 0 6.4M18.2 6.2a8 8 0 0 1 0 11.6"/></svg>
              </button>
            </div>
            <div class="card-root-back" id="card-root-back"></div>
            <div class="card-hook" id="card-mnemonic"></div>
            <div class="card-zh" id="card-zh"></div>
            <div class="card-section" id="card-example-wrap">
              <div class="card-label">例句</div>
              <div id="card-example" class="card-example"></div>
            </div>
            <div class="card-section" id="card-syn-wrap">
              <div class="card-label">同義詞</div>
              <div id="card-syn" class="card-syn"></div>
            </div>
          </div>
        </div>
      </div>
      </div>
      <div class="action-stack">
        <button id="btn-memorized" class="action-btn" title="背起來了">
          <span class="action-circle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          </span>
          <span class="action-label">背起來了</span>
        </button>
      </div>
    </div>
  </section>

  <!-- SESSION COMPLETE -->
  <section id="view-done" class="view">
    <div class="done-stage">
      <div class="done-emoji" id="done-emoji">🎉</div>
      <div class="done-title" id="done-title">全部背起來了！</div>
      <div class="done-stats" id="done-stats"></div>
      <button id="btn-done-next" class="cta-btn" style="display:none">繼續背</button>
      <button id="btn-done-home" class="secondary-btn" style="max-width:200px">回首頁</button>
    </div>
  </section>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.update();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    });
  });
  let refreshedForNewSW = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshedForNewSW) return;
    refreshedForNewSW = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
